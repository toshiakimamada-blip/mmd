# アプリサーバー（FastAPI）のプロジェクト定義。
# 依存の版は uv.lock で固定する。依存を足したら `uv lock` で更新し、uv.lock も一緒にコミットする。
[project]
name = "meeting-interpreter-server"
version = "0.1.0"
description = "会議通訳アプリのアプリサーバー（画面の配信・HTTP・WebSocket）"
# Ubuntu 24.04 の標準の Python（3.12 系）に合わせる。
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "websockets",
]

[dependency-groups]
# 実行イメージのアプリサーバーには入れない開発用の依存。
dev = [
    "httpx2",      # FastAPI の TestClient が使う
    "pytest",
    "pytest-cov",
    "ruff",
]
# 翻訳モデルの変換プロセスだけが使う部品（ADR-16）。アプリサーバーの環境には入れず、
# イメージの別の環境（/opt/conversion-venv）へ入れる。変換の方式と、部品を選んだ理由は
# output_system/docs/models.md の「翻訳モデルの変換」にある。
# 版は uv.lock で固定する。ここに書くのは、下限と、選んだ部品の名前だけ。
conversion = [
    # 重みの読み込みと、変換元の Hugging Face の形式の読み込み。
    # 2.6.0 未満は、torch.load の weights_only=True を回避できる脆弱性（CVE-2025-32434）がある。
    # CPU 版の wheel（[tool.uv.sources] で指す）に固定し、NVIDIA の CUDA 部品を取り込まない。
    "torch>=2.6.0",
    # 変換元の翻訳モデル（Marian の構造）を読み込む。
    "transformers",
    # 実行基盤の形式への変換。同じ部品が、翻訳の実行基盤にもなる。
    "ctranslate2",
    # 文字の分割。変換元のトークナイザー（MarianTokenizer）が使う。
    "sentencepiece",
]
interpreter = [
    "faster-whisper>=1.2.1",
    "sentencepiece>=0.2.2",
]
# 生成ワーカー（要約と質問の文章を作る別のプロセス）が使う部品。llama.cpp の Python の結び付け。
# PyPI には wheel が無く、ソースから組み立てる。組み立ての指定は [tool.uv.config-settings-package] にある。
# 組み込む方式を選んだ理由は output_system/docs/models.md の「文章生成モデルの動かし方」にある。
generation = [
    "llama-cpp-python>=0.3.36",
]

[tool.uv]
# アプリとして動かすだけで、ライブラリとしては配布しない。
# コードは PYTHONPATH（pytest では pythonpath 設定）で src/ を指して読み込む。
package = false
# 開発環境（uv sync）には、変換の部品と 2 つのワーカーの部品も入れる。それぞれの自動テストが使うため。
# イメージでは、アプリサーバーの環境に入れない（Dockerfile が --no-default-groups で外す）。
default-groups = ["dev", "conversion", "interpreter", "generation"]
# サプライチェーン攻撃への対策。公開から 7 日未満の版は、版の解決の対象にしない。
# 既にロックファイルへ記録した版には影響しない。
exclude-newer = "7 days"

# PyTorch は、CPU 版の wheel の配布元から入れる。
# Linux 向けの標準の wheel は、NVIDIA 独自のライセンスの CUDA 部品を取り込む。
# CPU 版なら取り込まず、イメージも小さくなる。explicit = true で、torch 以外はこの配布元から入れない。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# llama-cpp-python は、ソースから組み立てる（scikit-build-core と CMake）。組み立ての指定は次のとおり。
# - GGML_NATIVE=OFF: 組み立てた PC の CPU に合わせた命令（-march=native）を使わない。使うと、別の CPU で
#   「不正な命令」で落ちるおそれがある。OFF にすると AVX2・FMA・F16C・BMI2 を使う（Haswell 以降の CPU）。
# - GGML_OPENMP=OFF: OpenMP の実行時の部品（libgomp）を要らなくする。ggml 自身のスレッドの仕組みで動く。
# - LLAVA_BUILD=OFF: 画像を扱う部品は使わない。
# 値を変えると、uv が組み立て直す（指定が、組み立ての結果の使い回しの鍵に入るため）。
[tool.uv.config-settings-package]
llama-cpp-python = { "cmake.define.GGML_NATIVE" = "OFF", "cmake.define.GGML_OPENMP" = "OFF", "cmake.define.LLAVA_BUILD" = "OFF" }

[tool.pytest.ini_options]
# テストは src/ と同じ階層の test/ に置き、src/ と同じ構造にする。
testpaths = ["test"]
pythonpath = ["src"]
addopts = "--cov=meeting_interpreter --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
src = ["src", "test"]

[tool.ruff.lint]
# E/F: pycodestyle と pyflakes。I: import の並び順。B: バグの出やすい書き方。
# T20: print の禁止。print は、ログの許可リストを通らずに標準出力へ出てしまう。
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
# 英語の会議の字幕のデータ。1 行が長い文があり、折り返すと読みにくくなる。
"test/meeting_subtitles.py" = ["E501"]
