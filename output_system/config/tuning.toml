# 調整値。アプリに同梱し、起動のときに読み込む。
#
# - ここが既定値の唯一の置き場。コードの中には既定値を持たない。
# - 環境変数でも上書きできる。名前は、項目名を大文字にして MMD_TUNING_ を付ける。
#   例: utterance_max_seconds → MMD_TUNING_UTTERANCE_MAX_SECONDS
# - すべて仮置き（AI 推奨）。利用者の PC で測った結果をもとに見直す。
#   見直しは、このファイルを書き換えたアプリの更新として行う。設定を画面から変える機能は設けない。
# - 項目を足したら、backend/src/meeting_interpreter/tuning.py の Tuning にも同じ名前で足す。
#   項目の過不足は、起動のときと自動テストで検出する。
# - 秘密の情報（パスワード・鍵）は置かない。

# --- 字幕の遅れ ---------------------------------------------------------------

# 発話の区切りの長さの上限（秒）。無音が来ないまま上限に達したら、そこで区切る。
# 字幕の遅れの配分（5 秒）の最初の段。短くすると遅れは縮むが、文の途中で区切れやすくなり、
# 聞き取りと訳の質が下がる。
utterance_max_seconds = 5.0

# 無音がこの秒数続いたら、字幕の状況を「無音の待機」にする（秒）。
silence_wait_seconds = 10.0

# 字幕の遅れの目標（秒）。これを超えると、字幕の状況を「遅れ」にする。
subtitle_delay_target_seconds = 10.0

# 字幕の遅れの判定の打ち切りの基準時刻。会議の終了のこの秒数前（600 秒 = 10 分前）。
# この時刻より後に受け付けた、質問の作成による区間だけは、判定から除いたままにする。
cutoff_before_end_seconds = 600

# --- 警告のしきい値 -----------------------------------------------------------

# 会議の長さの警告を出す経過時間（秒）。7200 秒 = 2 時間。超えても会議は続ける。
meeting_length_warning_seconds = 7200

# ディスクの空きがこの量（GB）を下回ったら、警告を出す。
disk_free_warning_gigabytes = 1.0

# --- 文章生成モデル（要約と質問） ---------------------------------------------

# 文章生成モデルへ一度に渡す字幕の量（文字数）。上限を超える場合は、直近の字幕を優先する。
# 文章生成モデル（Qwen3-4B）の文脈の長さに収まる量にする。質問の作成時間の目標にも効く。
generation_input_max_chars = 4000

# 生成ワーカーに割り当てる CPU のスレッド数。
# 動かす PC は 8 スレッド。会議をしていないときは、全部を使う。
generation_cpu_threads_normal = 8
# 会議中は、字幕の処理を優先するため、割り当てを減らす（通常以下にすること）。
generation_cpu_threads_during_meeting = 2
