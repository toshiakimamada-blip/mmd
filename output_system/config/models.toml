# AI モデルの定義。アプリに同梱し、起動のときに読み込む。
#
# 文字起こし・翻訳・文章生成の 3 つの AI モデルについて、名前・役割・配布元・固定した版・
# ファイルごとの名前と大きさと SHA-256・ライセンス名を書く。
# 入手と確認は、この定義のとおりに行う（機能設計書 F-16、ADR-14）。
#
# 決まり
# - 版（revision）は、配布元のリポジトリのコミット（40 桁）で固定する。ブランチ名やタグ、「最新」は使わない。
# - 入手先は `<repository_url>/resolve/<revision>/<ファイル名>`。HTTPS だけで入手する。
# - sha256 は、入手したファイルが配布元のものと一致するかの確認に使う。一致しないファイルは捨てる。
# - 業務で使えるライセンスの AI モデルだけを書く。非商用に限るライセンスは書けない（読み込みで失敗する）。
# - ファイルは、動かすのに要るものだけを書く。同じリポジトリの別の量子化など、使わないファイルは書かない。
#
# SHA-256 の出どころ
# - 「配布元が公開している値」とあるファイルは、配布元（Hugging Face）の API が返す LFS の sha256 を使った。
# - 「求めた値」とあるファイルは、配布元が値を公開していない（LFS ではなく Git で保管された小さなファイル）。
#   固定した版の URL から公式の配布元のファイルを入手し、sha256sum で求めた値を書いた。
#
# 項目を足す・版を上げるときは、backend/src/meeting_interpreter/models/definition.py の検証を通る形にする。
# 翻訳モデルの代わりになる候補は、同じフォルダーの translation_alternatives.md にある。

# --- 文字起こし: Whisper small.en（CTranslate2 形式） -----------------------------------
# 実行基盤は faster-whisper。OpenAI の Whisper small.en を CTranslate2 の形式に変換したもので、
# faster-whisper の開発元（SYSTRAN）が配布している。OpenAI 自身の配布物ではない。
# この配布元を要件の「公式の配布元」として扱ってよいかは、利用者に確認中（PBI #17 のコメントを参照）。
[[models]]
name = "whisper-small-en"
role = "transcription"
repository_url = "https://huggingface.co/Systran/faster-whisper-small.en"
revision = "d1d751a5f8271d482d14ca55d9e2deeebbae577f"
license = "MIT"

