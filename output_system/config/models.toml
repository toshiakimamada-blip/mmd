# --- 翻訳: FuguMT 英語から日本語（変換前） -----------------------------------------------
# 開発元（staka）が配布するのは、Marian-NMT の PyTorch 形式。実行基盤（CTranslate2）の形式への変換は、
# 入手と確認のあとに行う（ADR-16）。変換前のファイルを、ここに書いた SHA-256 で確かめる。
# ファイルの要否（文字の分割に使う source.spm・target.spm など）は、翻訳モデルの変換方式を決める作業で
# 確かめる。それまでは、リポジトリのモデルのファイルをすべて書いておく（README と .gitattributes を除く）。
#
# ライセンスの補足: CC BY-SA 4.0。ただし作者の README（https://github.com/s-taka/fugumt）に
# 「本モデルは研究用を目的に公開しています。」の記載がある。業務で使えるかは、利用者が社内の
# 法務・知財部門に確認中。確認が取れるまでの仮置き。使えないと分かった場合の代わりの候補は、
# translation_alternatives.md にある。
[[models]]
name = "fugumt-en-ja"
role = "translation"
repository_url = "https://huggingface.co/staka/fugumt-en-ja"
revision = "fbb91252110cf97d90291eb808629ab0b10f7928"
license = "CC BY-SA 4.0"
license_note = "作者の README（https://github.com/s-taka/fugumt）に「本モデルは研究用を目的に公開しています。」の記載がある。業務で使えるかは、利用者が社内の法務・知財部門に確認中。確認が取れるまでの仮置き。"

